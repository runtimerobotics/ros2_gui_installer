name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly, to catch ROS packages that disappear from apt
  workflow_dispatch:

jobs:
  lint:
    name: Lint (shellcheck, pyflakes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck python3-pyflakes
      # helper.sh runs as root and install.sh is piped from curl, so warnings there fail the build
      - run: shellcheck --severity=warning helper.sh install.sh packaging/build-deb.sh
      - run: python3 -m pyflakes ros2_installer.py test_installer.py

  test:
    name: Ubuntu ${{ matrix.ubuntu }} ${{ matrix.runner == 'ubuntu-24.04-arm' && 'arm64' || 'amd64' }}
    runs-on: ${{ matrix.runner }}
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04", "26.04"]  # Humble, Jazzy, Lyrical
        runner: [ubuntu-latest, ubuntu-24.04-arm]  # amd64 and real arm64 hardware
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install the GUI's dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 python3-yaml

      - uses: actions/checkout@v4

      # Run the real root helper the way the app does, on a machine with the problems it must survive:
      # an old-style ROS 2 source (the pre-2025 layout) and a dead third-party repository.
      - name: Set up an old ROS 2 source and a broken repository
        shell: bash
        run: |
          codename=$(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}")
          echo "deb [signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $codename main" \
            > /etc/apt/sources.list.d/ros2.list
          echo "deb http://ppa.launchpadcontent.net/nonexistent-team/nonexistent/ubuntu $codename main" \
            > /etc/apt/sources.list.d/broken-ppa.list
          # A user's ROS 2 testing repository: the cleanup must leave it alone.
          echo "deb [signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2-testing/ubuntu $codename main" \
            > /etc/apt/sources.list.d/ros2-testing.list

      - name: Install turtlesim with the real helper
        shell: bash
        run: |
          distro=$(python3 -c "import ros2_installer as r; print(r.detect_distro())")
          ./helper.sh install "ros-$distro-turtlesim" | tee /tmp/helper.log
          test -d "/opt/ros/$distro/share/turtlesim"                          # installed
          test ! -e /etc/apt/sources.list.d/ros2.list                          # old source switched off
          test -e /etc/apt/sources.list.d/ros2.list.disabled-by-ros2-installer
          test -e /etc/apt/sources.list.d/ros2-testing.list                    # other ROS repos untouched
          grep -q '^pmstatus:' /tmp/helper.log                                 # progress bar input arrived

      - name: Run the self-test
        run: python3 test_installer.py

      - name: Check shell scripts parse
        run: bash -n helper.sh && bash -n install.sh

  deb:
    name: .deb package
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - name: Build, install and check the .deb
        shell: bash
        run: |
          deb=$(packaging/build-deb.sh)
          apt-get install -y "./${deb#$PWD/}"
          want=$(sed -n 's/^__version__ = "\([^"]*\)".*/\1/p' ros2_installer.py)
          test "$(ros2-gui-installer --version)" = "ROS 2 Installer $want"
          test "$(stat -c %U /usr/lib/ros2-gui-installer/helper.sh)" = root   # users can't edit the root helper
          test -f /usr/share/polkit-1/actions/com.runtimerobotics.Ros2Installer.policy
          /usr/lib/ros2-gui-installer/helper.sh check ros-jazzy-joy
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
