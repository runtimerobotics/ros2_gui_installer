# What the installer offers. "{distro}" becomes humble / jazzy / lyrical.
# Add a goal by adding an entry under "goals" -- no code changes needed.
# A goal whose packages are not in the ROS apt repo for this distro is greyed out.
# "packages" and "command" can be one value, or a map of {default: ..., humble: ...}
# when a distro needs something different. "requires" ticks other goals too.
# "category" puts a goal in one of the collapsible groups listed under "categories".
# "demo" is optional: leave it out when a section needs real hardware to show anything.

distros:            # Ubuntu VERSION_ID -> ROS 2 distro
  "22.04": humble
  "24.04": jazzy
  "26.04": lyrical

base:
  variants:
    desktop:
      title: Desktop
      description: ROS 2 with RViz, rqt and the demos. Best place to start.
      default: true
      packages:
        - ros-{distro}-desktop
        - ros-dev-tools
    desktop-full:
      title: Desktop-Full
      description: Everything in Desktop, plus simulation and perception tools. Bigger download.
      packages:
        - ros-{distro}-desktop-full
        - ros-dev-tools
  demo:
    title: Talker
    command: ros2 run demo_nodes_cpp talker

categories:         # shown in this order on the choose page
  - {id: simulate, title: Simulate}
  - {id: models, title: Robot models}
  - {id: tools, title: See and record}
  - {id: sensors, title: Sensors and cameras}
  - {id: mobile, title: Mobile robots and navigation}
  - {id: arms, title: Robot arms}
  - {id: connect, title: Connect to other tools}

goals:
  - id: simulation
    category: simulate
    title: Simulate robots
    icon: applications-science-symbolic
    description: Gazebo simulator connected to ROS 2, with ros2_control so simulated robots can move.
    packages:
      - ros-{distro}-ros-gz
      - ros-{distro}-ros-gz-sim-demos
      - ros-{distro}-ros2-control
      - ros-{distro}-ros2-controllers
      - ros-{distro}-gz-ros2-control
      - ros-{distro}-gz-ros2-control-demos
      - ros-{distro}-xacro
      - ros-{distro}-joint-state-publisher-gui
    demo:
      title: Diff-drive robot in Gazebo
      command: ros2 launch gz_ros2_control_demos diff_drive_example.launch.py

  - id: mobile
    category: mobile
    title: Drive a mobile robot
    icon: input-gaming-symbolic
    description: TurtleBot 4 in Gazebo, plus SLAM Toolbox for building maps.
    requires: [simulation]
    packages:
      - ros-{distro}-turtlebot4-simulator
      - ros-{distro}-slam-toolbox
    demo:
      title: TurtleBot 4 in Gazebo
      command:
        default: ros2 launch turtlebot4_gz_bringup turtlebot4_gz.launch.py
        humble: ros2 launch turtlebot4_ignition_bringup turtlebot4_ignition.launch.py

  - id: nav2
    category: mobile
    title: Navigate on its own (Nav2)
    icon: mark-location-symbolic
    description: The Nav2 navigation stack. Send a goal on the map and the robot plans and drives there.
    requires: [simulation]
    packages:
      default:
        - ros-{distro}-navigation2
        - ros-{distro}-nav2-bringup
      humble:   # Humble's Nav2 demo uses TurtleBot 3 in Gazebo Classic
        - ros-{distro}-navigation2
        - ros-{distro}-nav2-bringup
        - ros-{distro}-turtlebot3-gazebo
    demo:
      title: Nav2 with a simulated robot
      command:
        default: ros2 launch nav2_bringup tb4_simulation_launch.py headless:=False
        humble: >-
          export TURTLEBOT3_MODEL=waffle
          GAZEBO_MODEL_PATH=$GAZEBO_MODEL_PATH:/opt/ros/humble/share/turtlebot3_gazebo/models &&
          ros2 launch nav2_bringup tb3_simulation_launch.py headless:=False

  - id: arm
    category: arms
    title: Control a robot arm
    icon: applications-engineering-symbolic
    description: Universal Robots arm in Gazebo, driven by ros2_control trajectory controllers.
    requires: [simulation]
    packages:
      - ros-{distro}-ur
      - ros-{distro}-ur-simulation-gz
      - ros-{distro}-rqt-joint-trajectory-controller
    demo:
      title: UR5e arm in Gazebo
      command: ros2 launch ur_simulation_gz ur_sim_control.launch.py ur_type:=ur5e

  - id: moveit
    category: arms
    title: Plan arm motion (MoveIt 2)
    icon: find-location-symbolic
    description: MoveIt 2 motion planning, with the Panda arm to try it in RViz.
    packages:
      - ros-{distro}-moveit
      - ros-{distro}-moveit-resources-panda-moveit-config
    demo:
      title: Panda arm with MoveIt 2 in RViz
      command: ros2 launch moveit_resources_panda_moveit_config demo.launch.py

  - id: remote
    category: connect
    title: Connect from a browser or other tools
    icon: network-workgroup-symbolic
    description: rosbridge (for web apps and the ROS MCP server) and Foxglove bridge (view your robot in Foxglove).
    packages:
      - ros-{distro}-rosbridge-suite
      - ros-{distro}-foxglove-bridge
    demo:
      title: rosbridge on ws://localhost:9090
      command: ros2 launch rosbridge_server rosbridge_websocket_launch.xml

  - id: teleop
    category: mobile
    title: Drive with keyboard or gamepad
    icon: input-keyboard-symbolic
    description: Keyboard and joystick teleop that works with any robot listening on cmd_vel.
    packages:
      - ros-{distro}-teleop-twist-keyboard
      - ros-{distro}-teleop-twist-joy
      - ros-{distro}-joy
    demo:
      title: Drive the turtle with your keyboard
      command: >-
        ros2 run turtlesim turtlesim_node &
        ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args -r cmd_vel:=turtle1/cmd_vel

  - id: perception
    category: sensors
    title: Use cameras
    icon: camera-web-symbolic
    description: OpenCV bridge, image processing, and drivers for USB webcams and Intel RealSense.
    packages:
      - ros-{distro}-vision-opencv
      - ros-{distro}-image-pipeline
      - ros-{distro}-v4l2-camera
      - ros-{distro}-realsense2-camera
    demo:
      title: Show your webcam
      command: ros2 run rqt_image_view rqt_image_view /image_raw & ros2 run v4l2_camera v4l2_camera_node

  - id: description
    category: models
    title: Describe your own robot (URDF)
    icon: document-edit-symbolic
    description: URDF and Xacro tools, robot_state_publisher, and the URDF tutorial robots.
    packages:
      - ros-{distro}-urdf-tutorial
      - ros-{distro}-urdf-launch
      - ros-{distro}-xacro
      - ros-{distro}-robot-state-publisher
      - ros-{distro}-joint-state-publisher-gui
    demo:
      title: R2D2 model in RViz with joint sliders
      command: ros2 launch urdf_tutorial display.launch.py model:=urdf/08-macroed.urdf.xacro

  - id: debugging
    category: tools
    title: Visualize and debug
    icon: utilities-system-monitor-symbolic
    description: rqt plugins (node graph, TF tree, topic monitor, console), robot diagnostics and RViz visual tools.
    packages:
      - ros-{distro}-rqt-common-plugins
      - ros-{distro}-rqt-tf-tree
      - ros-{distro}-tf2-tools
      - ros-{distro}-rqt-robot-monitor
      - ros-{distro}-diagnostic-aggregator
      - ros-{distro}-rviz-visual-tools
    demo:
      title: See talker and listener in the node graph
      command: ros2 run demo_nodes_cpp talker & ros2 run demo_nodes_py listener & ros2 run rqt_graph rqt_graph

  - id: recording
    category: tools
    title: Record and replay data
    icon: media-record-symbolic
    description: rosbag2 with the MCAP format, rqt_bag, and PlotJuggler for plotting topics.
    packages:
      default:
        - ros-{distro}-rosbag2
        - ros-{distro}-rosbag2-storage-mcap
        - ros-{distro}-rqt-bag
        - ros-{distro}-plotjuggler-ros
      lyrical:  # PlotJuggler isn't released for Lyrical yet
        - ros-{distro}-rosbag2
        - ros-{distro}-rosbag2-storage-mcap
        - ros-{distro}-rqt-bag
    demo:
      title: Record the talker into ~/ros2_bags
      command: >-
        mkdir -p ~/ros2_bags && ros2 run demo_nodes_cpp talker &
        ros2 bag record /chatter -o ~/ros2_bags/demo_$(date +%Y%m%d_%H%M%S)

  - id: sensors
    category: sensors
    title: Use LiDAR, IMU and GPS
    icon: network-wireless-symbolic
    description: Drivers for Velodyne and Hokuyo LiDARs, IMU filters, NMEA GPS, and point cloud tools.
    packages:
      default:
        - ros-{distro}-velodyne
        - ros-{distro}-urg-node
        - ros-{distro}-imu-tools
        - ros-{distro}-nmea-navsat-driver
        - ros-{distro}-pointcloud-to-laserscan
        - ros-{distro}-pcl-ros
      lyrical:  # no Velodyne driver for Lyrical yet
        - ros-{distro}-urg-node
        - ros-{distro}-imu-tools
        - ros-{distro}-nmea-navsat-driver
        - ros-{distro}-pointcloud-to-laserscan
        - ros-{distro}-pcl-ros

  - id: localization
    category: mobile
    title: Know where the robot is (localization)
    icon: find-location-symbolic
    description: robot_localization fuses wheel odometry, IMU and GPS; AMCL and Cartographer locate the robot on a map.
    packages:
      default:
        - ros-{distro}-robot-localization
        - ros-{distro}-nav2-amcl
        - ros-{distro}-cartographer-ros
      lyrical:  # no Cartographer for Lyrical yet
        - ros-{distro}-robot-localization
        - ros-{distro}-nav2-amcl

  - id: manipulation
    category: arms
    title: More arm tools (MoveIt extras)
    icon: applications-engineering-symbolic
    description: MoveIt Servo for real-time jogging, the Python API, extra planners and IK, and the Robotiq gripper model.
    requires: [moveit]
    packages:
      - ros-{distro}-moveit-servo
      - ros-{distro}-moveit-py
      - ros-{distro}-moveit-visual-tools
      - ros-{distro}-moveit-planners-chomp
      - ros-{distro}-pick-ik
      - ros-{distro}-robotiq-description
    demo:
      title: Jog the Panda arm with MoveIt Servo
      command:
        default: ros2 launch moveit_servo demo_twist.launch.py
        humble: ros2 launch moveit_servo servo_example.launch.py

# Network settings page. Saved to ~/.config/ros2-gui-installer/env.sh, which ~/.bashrc loads.
network:
  rmw:
    - id: default
      title: Default (Fast DDS)
      description: Works out of the box.
    - id: rmw_cyclonedds_cpp
      title: Cyclone DDS
      description: Often more reliable on Wi-Fi and busy classroom networks.
      package: ros-{distro}-rmw-cyclonedds-cpp
    - id: rmw_zenoh_cpp
      title: Zenoh
      description: "Needs a router running in another terminal: ros2 run rmw_zenoh_cpp rmw_zenohd"
      package: ros-{distro}-rmw-zenoh-cpp
