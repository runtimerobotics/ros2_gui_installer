# What the installer offers. "{distro}" becomes humble / jazzy / lyrical.
# Add a goal by adding an entry under "goals" -- no code changes needed.
# A goal whose packages are not in the ROS apt repo for this distro is greyed out.
# "packages" and "command" can be one value, or a map of {default: ..., humble: ...}
# when a distro needs something different; "humble-arm64:" overrides one distro on one
# architecture. A demo command of null means "no demo there". "requires" ticks other goals too.
# "category" puts a goal in one of the collapsible groups listed under "categories".
# "demo" is optional: leave it out when a section needs real hardware to show anything.
# "not_released_for" lists distros (or distro-arch, like humble-arm64) where a goal is expected
# to be greyed out (checked by CI).

distros:            # Ubuntu codename -> ROS 2 distro. Ubuntu-based systems (Mint, Pop!_OS)
  jammy: humble     # report the Ubuntu codename they're built on as UBUNTU_CODENAME.
  noble: jazzy      # 22.04 / 24.04 / 26.04
  resolute: lyrical

base:
  variants:         # shown in this order; "default" is pre-selected and marked recommended
    desktop-full:
      title: Desktop-Full
      description: Everything to learn ROS 2 and simulate robots, with the Gazebo simulator, RViz and rqt. The biggest download.
      default: true
      packages:
        - ros-{distro}-desktop-full
        - ros-dev-tools
    desktop:
      title: Desktop
      description: ROS 2 with RViz, rqt and the demos, but no simulator. A smaller download if space or internet is tight.
      packages:
        - ros-{distro}-desktop
        - ros-dev-tools
    ros-base:
      title: ROS-Base
      description: Only the core of ROS 2, no windows or tools. For robots and boards without a screen (Raspberry Pi, Jetson).
      packages:
        - ros-{distro}-ros-base
        - ros-dev-tools
  demos:            # offered on the last page when their "packages" (if any) are installed
    - title: Talker
      command: ros2 run demo_nodes_cpp talker
      packages:
        - ros-{distro}-demo-nodes-cpp   # comes with Desktop and Desktop-Full, not with ROS-Base
    - title: Check that ROS 2 works
      command: ros2 doctor --report

categories:         # shown in this order on the choose page
  - {id: learn, title: Learn ROS 2}
  - {id: simulate, title: Simulate}
  - {id: models, title: Robot models}
  - {id: tools, title: See and record}
  - {id: sensors, title: Sensors and cameras}
  - {id: mobile, title: Mobile robots and navigation}
  - {id: arms, title: Robot arms}
  - {id: behavior, title: Behavior and task logic}
  - {id: connect, title: Connect to other tools}
  - {id: dev, title: Developer tools}

goals:
  - id: simulation
    category: simulate
    title: Simulate robots
    icon: applications-science-symbolic
    description: "Run robots in a 3D virtual world on your computer, no hardware needed. Includes the Gazebo simulator and ros2_control, so simulated robots can move."
    packages:
      - ros-{distro}-ros-gz
      - ros-{distro}-ros-gz-sim-demos
      - ros-{distro}-ros2-control
      - ros-{distro}-ros2-controllers
      - ros-{distro}-gz-ros2-control
      - ros-{distro}-gz-ros2-control-demos
      - ros-{distro}-xacro
      - ros-{distro}-joint-state-publisher-gui
    demo:
      title: Diff-drive robot in Gazebo
      command: ros2 launch gz_ros2_control_demos diff_drive_example.launch.py

  - id: mobile
    category: mobile
    not_released_for: [lyrical]  # no TurtleBot 4 for Lyrical yet; CI fails once it's released, so remove this then
    title: Drive a mobile robot
    icon: input-gaming-symbolic
    description: "Drive a virtual TurtleBot 4 robot and let it build a map of its surroundings. Includes the TurtleBot 4 simulator and SLAM Toolbox."
    requires: [simulation]
    packages:
      - ros-{distro}-turtlebot4-simulator
      - ros-{distro}-slam-toolbox
    demo:
      title: TurtleBot 4 in Gazebo
      command:
        default: ros2 launch turtlebot4_gz_bringup turtlebot4_gz.launch.py
        humble: ros2 launch turtlebot4_ignition_bringup turtlebot4_ignition.launch.py

  - id: nav2
    category: mobile
    title: Navigate on its own (Nav2)
    icon: mark-location-symbolic
    description: "Let a robot find its own way to a point you click on a map, avoiding obstacles. Includes the Nav2 navigation stack."
    requires: [simulation]
    packages:
      default:
        - ros-{distro}-navigation2
        - ros-{distro}-nav2-bringup
      humble:   # Humble's Nav2 demo uses TurtleBot 3 in Gazebo Classic
        - ros-{distro}-navigation2
        - ros-{distro}-nav2-bringup
        - ros-{distro}-turtlebot3-gazebo
      humble-arm64:   # Gazebo Classic isn't built for arm64 (Jetson, Raspberry Pi): Nav2 without the demo world
        - ros-{distro}-navigation2
        - ros-{distro}-nav2-bringup
    demo:
      title: Nav2 with a simulated robot
      command:
        default: ros2 launch nav2_bringup tb4_simulation_launch.py headless:=False
        humble-arm64: null
        humble: >-
          export TURTLEBOT3_MODEL=waffle
          GAZEBO_MODEL_PATH=$GAZEBO_MODEL_PATH:/opt/ros/humble/share/turtlebot3_gazebo/models &&
          ros2 launch nav2_bringup tb3_simulation_launch.py headless:=False

  - id: arm
    category: arms
    title: Control a robot arm
    icon: applications-engineering-symbolic
    description: "Move a virtual industrial robot arm. Includes a Universal Robots arm in Gazebo, driven by ros2_control."
    requires: [simulation]
    packages:
      - ros-{distro}-ur
      - ros-{distro}-ur-simulation-gz
      - ros-{distro}-rqt-joint-trajectory-controller
    demo:
      title: UR5e arm in Gazebo
      command: ros2 launch ur_simulation_gz ur_sim_control.launch.py ur_type:=ur5e

  - id: moveit
    category: arms
    title: Plan arm motion (MoveIt 2)
    icon: find-location-symbolic
    description: "Let the computer plan how a robot arm reaches a target without hitting anything. Includes MoveIt 2, with the Panda arm to try it in RViz."
    packages:
      - ros-{distro}-moveit
      - ros-{distro}-moveit-resources-panda-moveit-config
    demo:
      title: Panda arm with MoveIt 2 in RViz
      command: ros2 launch moveit_resources_panda_moveit_config demo.launch.py

  - id: remote
    category: connect
    title: Connect from a browser or other tools
    icon: network-workgroup-symbolic
    description: "See and control your robot from a web browser or other apps. Includes rosbridge (for web apps and the ROS MCP server) and Foxglove bridge."
    packages:
      - ros-{distro}-rosbridge-suite
      - ros-{distro}-foxglove-bridge
    demo:
      title: rosbridge on ws://localhost:9090
      command: ros2 launch rosbridge_server rosbridge_websocket_launch.xml

  - id: teleop
    category: mobile
    title: Drive with keyboard or gamepad
    icon: input-keyboard-symbolic
    description: "Drive any robot with your keyboard or a gamepad. Includes keyboard and joystick teleop for robots that listen on cmd_vel."
    packages:
      - ros-{distro}-teleop-twist-keyboard
      - ros-{distro}-teleop-twist-joy
      - ros-{distro}-joy
    demo:
      title: Drive the turtle with your keyboard
      command: >-
        ros2 run turtlesim turtlesim_node &
        ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args -r cmd_vel:=turtle1/cmd_vel

  - id: perception
    category: sensors
    title: Use cameras
    icon: camera-web-symbolic
    description: "Use USB webcams and depth cameras with ROS 2. Includes OpenCV, image processing, and drivers for webcams and Intel RealSense."
    packages:
      - ros-{distro}-vision-opencv
      - ros-{distro}-image-pipeline
      - ros-{distro}-v4l2-camera
      - ros-{distro}-realsense2-camera
    demo:
      title: Show your webcam
      command: ros2 run rqt_image_view rqt_image_view /image_raw & ros2 run v4l2_camera v4l2_camera_node

  - id: description
    category: models
    title: Describe your own robot (URDF)
    icon: document-edit-symbolic
    description: "Describe your own robot's shape and joints, and see it in 3D. Includes URDF and Xacro tools, robot_state_publisher and the tutorial robots."
    packages:
      - ros-{distro}-urdf-tutorial
      - ros-{distro}-urdf-launch
      - ros-{distro}-xacro
      - ros-{distro}-robot-state-publisher
      - ros-{distro}-joint-state-publisher-gui
    demo:
      title: R2D2 model in RViz with joint sliders
      command: ros2 launch urdf_tutorial display.launch.py model:=urdf/08-macroed.urdf.xacro

  - id: debugging
    category: tools
    title: Visualize and debug
    icon: utilities-system-monitor-symbolic
    description: "See what's happening inside ROS 2, like which programs talk to each other and where each part of the robot is. Includes rqt plugins, diagnostics and RViz tools."
    packages:
      - ros-{distro}-rqt-common-plugins
      - ros-{distro}-rqt-tf-tree
      - ros-{distro}-tf2-tools
      - ros-{distro}-rqt-robot-monitor
      - ros-{distro}-diagnostic-aggregator
      - ros-{distro}-rviz-visual-tools
    demo:
      title: See talker and listener in the node graph
      command: ros2 run demo_nodes_cpp talker & ros2 run demo_nodes_py listener & ros2 run rqt_graph rqt_graph

  - id: recording
    category: tools
    title: Record and replay data
    icon: media-record-symbolic
    description: "Record what your robot senses and does, replay it later, and plot it. Includes rosbag2 (MCAP format), rqt_bag and PlotJuggler."
    packages:
      default:
        - ros-{distro}-rosbag2
        - ros-{distro}-rosbag2-storage-mcap
        - ros-{distro}-rqt-bag
        - ros-{distro}-plotjuggler-ros
      lyrical:  # PlotJuggler isn't released for Lyrical yet
        - ros-{distro}-rosbag2
        - ros-{distro}-rosbag2-storage-mcap
        - ros-{distro}-rqt-bag
    demo:
      title: Record the talker into ~/ros2_bags
      command: >-
        mkdir -p ~/ros2_bags && ros2 run demo_nodes_cpp talker &
        ros2 bag record /chatter -o ~/ros2_bags/demo_$(date +%Y%m%d_%H%M%S)

  - id: sensors
    category: sensors
    title: Use LiDAR, IMU and GPS
    icon: network-wireless-symbolic
    description: "Use laser scanners (LiDAR), motion sensors (IMU) and GPS. Includes drivers for Velodyne and Hokuyo LiDARs, IMU filters, NMEA GPS and point cloud tools."
    packages:
      default:
        - ros-{distro}-velodyne
        - ros-{distro}-urg-node
        - ros-{distro}-imu-tools
        - ros-{distro}-nmea-navsat-driver
        - ros-{distro}-pointcloud-to-laserscan
        - ros-{distro}-pcl-ros
      lyrical:  # no Velodyne driver for Lyrical yet
        - ros-{distro}-urg-node
        - ros-{distro}-imu-tools
        - ros-{distro}-nmea-navsat-driver
        - ros-{distro}-pointcloud-to-laserscan
        - ros-{distro}-pcl-ros

  - id: localization
    category: mobile
    title: Know where the robot is (localization)
    icon: find-location-symbolic
    description: "Work out where the robot is, from its wheels, motion sensor, GPS or a map. Includes robot_localization, AMCL and Cartographer."
    packages:
      default:
        - ros-{distro}-robot-localization
        - ros-{distro}-nav2-amcl
        - ros-{distro}-cartographer-ros
      lyrical:  # no Cartographer for Lyrical yet
        - ros-{distro}-robot-localization
        - ros-{distro}-nav2-amcl

  - id: manipulation
    category: arms
    title: More arm tools (MoveIt extras)
    icon: applications-engineering-symbolic
    description: "Extra arm tools, like moving an arm live with a joystick or controlling MoveIt from Python. Includes MoveIt Servo, the Python API, extra planners and IK, and the Robotiq gripper model."
    requires: [moveit]
    packages:
      - ros-{distro}-moveit-servo
      - ros-{distro}-moveit-py
      - ros-{distro}-moveit-visual-tools
      - ros-{distro}-moveit-planners-chomp
      - ros-{distro}-pick-ik
      - ros-{distro}-robotiq-description
    demo:
      title: Jog the Panda arm with MoveIt Servo
      command:
        default: ros2 launch moveit_servo demo_twist.launch.py
        humble: ros2 launch moveit_servo servo_example.launch.py

  - id: learn
    category: learn
    title: Tutorials and examples
    icon: help-browser-symbolic
    description: "Everything the official beginner tutorials use, like the turtlesim robot and small example programs. Includes turtlesim, minimal C++ and Python nodes, actions, TF2 and lifecycle examples."
    packages:
      - ros-{distro}-turtlesim
      - ros-{distro}-demo-nodes-py
      - ros-{distro}-examples-rclcpp-minimal-publisher
      - ros-{distro}-examples-rclcpp-minimal-subscriber
      - ros-{distro}-examples-rclpy-minimal-publisher
      - ros-{distro}-examples-rclpy-minimal-subscriber
      - ros-{distro}-action-tutorials-cpp
      - ros-{distro}-action-tutorials-py
      - ros-{distro}-turtle-tf2-py
      - ros-{distro}-turtle-tf2-cpp
      - ros-{distro}-lifecycle-py
    demo:
      title: Two turtles following each other with TF2
      command: ros2 launch turtle_tf2_py turtle_tf2_demo.launch.py

  - id: turtlebot3
    category: mobile
    title: TurtleBot 3
    icon: input-gaming-symbolic
    description: "The small classic robot used in many courses, in a virtual world or for real. Includes the TurtleBot 3 packages, Gazebo worlds and keyboard driving."
    requires: [simulation]
    packages:
      default:
        - ros-{distro}-turtlebot3
        - ros-{distro}-turtlebot3-simulations
      lyrical:  # only the simulation packages are released for Lyrical so far
        - ros-{distro}-turtlebot3-simulations
      humble-arm64:  # no Gazebo Classic simulation on arm64; the real-robot packages are there
        - ros-{distro}-turtlebot3
    demo:
      title: TurtleBot 3 in a Gazebo world
      command:
        default: export TURTLEBOT3_MODEL=burger && ros2 launch turtlebot3_gazebo turtlebot3_world.launch.py
        humble-arm64: null

  - id: rtabmap
    category: mobile
    title: 3D mapping (RTAB-Map)
    icon: mark-location-symbolic
    description: "Build 3D maps of rooms with a depth camera or LiDAR. Includes RTAB-Map."
    packages:
      - ros-{distro}-rtabmap-ros

  - id: markers
    category: sensors
    title: Markers and AprilTags
    icon: view-grid-symbolic
    description: "Find printed tags (AprilTags, ArUco markers) in a camera image and work out where they are. Includes apriltag_ros and aruco_opencv."
    packages:
      - ros-{distro}-apriltag-ros
      - ros-{distro}-aruco-opencv

  - id: behavior
    category: behavior
    title: Behavior trees and state machines
    icon: view-list-symbolic
    description: "Program what a robot should do step by step, and what to do when something fails. Includes BehaviorTree.CPP (used by Nav2), py_trees with tutorials, SMACH and FlexBE."
    packages:
      - ros-{distro}-behaviortree-cpp
      - ros-{distro}-py-trees-ros
      - ros-{distro}-py-trees-ros-tutorials
      - ros-{distro}-smach-ros
      - ros-{distro}-flexbe-behavior-engine
    demo:
      title: A behavior tree checking a mock robot's battery
      command: ros2 launch py_trees_ros_tutorials tutorial_two_battery_check_launch.py

  - id: devtools
    category: dev
    title: Build, test and debug your own packages
    icon: applications-engineering-symbolic
    description: "Tools for when you write your own ROS 2 code, like style checks, tests and tracing. Includes ament linters, clang-format, launch testing, generate_parameter_library, tracing and SROS2."
    packages:
      - ros-{distro}-ament-lint-auto
      - ros-{distro}-ament-lint-common
      - ros-{distro}-ament-cmake-clang-format
      - ros-{distro}-launch-testing-ament-cmake
      - ros-{distro}-generate-parameter-library
      - ros-{distro}-tracetools-launch
      - ros-{distro}-sros2

# Network settings page. Saved to ~/.config/ros2-gui-installer/env.sh, which ~/.bashrc loads.
network:
  rmw:
    - id: default
      title: Default (Fast DDS)
      description: Works out of the box.
    - id: rmw_cyclonedds_cpp
      title: Cyclone DDS
      description: Often more reliable on Wi-Fi and busy classroom networks.
      package: ros-{distro}-rmw-cyclonedds-cpp
    - id: rmw_zenoh_cpp
      title: Zenoh
      description: "Needs a router running in another terminal: ros2 run rmw_zenoh_cpp rmw_zenohd"
      package: ros-{distro}-rmw-zenoh-cpp
